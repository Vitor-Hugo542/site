<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Basicão</title>
</head>
<body>
    <h1>Corote H1</h1>
    <h2>Corote H2</h2>
    <h3>Corote H3</h3>
